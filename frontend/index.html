<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <meta name="description" content="Pulse — Smart Campus Emergency Response. Report. Respond. Protect." />
    <title>Pulse</title>
    <!-- Favicon set: 32x32 PNG for modern browsers, .ico for legacy, 180x180
         for iOS home-screen pinning. /logo.png is the full branding image
         (used in the navbar); the favicon variants are tight crops so the
         pin+heartbeat mark reads clearly at tab-strip size. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Poppins — rounded geometric sans matched to Citizen.com's "Circular"
         aesthetic. 400 / 500 / 600 / 700 covers everything we use (body, nav,
         buttons, headlines). Preconnect shaves 100-200ms off the first paint. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Leaflet CSS is imported via main.jsx from the bundled package, not
         from a CDN, so the map works on any network. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
